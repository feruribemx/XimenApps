<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Tablas del 1 al 9</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: una sola columna centrada; la niña ve una tarjeta grande con teclado, el panel de papás es un tablero escaneable. */
:root{
  --bg:#fff6f1; --surface:#ffffff; --ink:#2b2340; --muted:#6f6688;
  --coral:#ff6b6b; --coral-ink:#c53d3d; --mint:#2bb39a; --sun:#ffb938; --line:#f0dfd8; --soft:#ffe9e2;
  --good:#1f9e7a; --warn:#d98a00; --bad:#d64545;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1726; --surface:#271f35; --ink:#f6eefc; --muted:#b5a9c9;
  --coral:#ff8585; --coral-ink:#ffb0b0; --mint:#47d1b5; --sun:#ffc85c; --line:#3a3050; --soft:#33283f;
  --good:#4fd1a8; --warn:#ffc04d; --bad:#ff7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1726; --surface:#271f35; --ink:#f6eefc; --muted:#b5a9c9;
  --coral:#ff8585; --coral-ink:#ffb0b0; --mint:#47d1b5; --sun:#ffc85c; --line:#3a3050; --soft:#33283f;
  --good:#4fd1a8; --warn:#ffc04d; --bad:#ff7b7b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.gate input{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.3rem}
.crown{width:34px;height:34px}
.link{background:none;color:var(--muted);font-weight:700;font-size:.9rem;padding:8px 10px;border-radius:10px}
.link:hover{background:var(--soft)}
.card{background:var(--surface);border-radius:24px;padding:24px;box-shadow:0 2px 0 var(--line),0 12px 30px -18px rgba(80,40,60,.35)}
.btn{background:var(--coral);color:#fff;font-family:var(--display);font-weight:600;font-size:1.25rem;padding:14px 28px;border-radius:16px;box-shadow:0 4px 0 var(--coral-ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-ink)}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);text-align:center}
/* Inicio */
.hello{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:32px}
.hello h1{font-size:clamp(2rem,6vw,2.8rem)}
.hello p{margin:0;max-width:34ch;color:var(--muted);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:.85rem;background:var(--soft)}
.chip.g{color:var(--good)} .chip.w{color:var(--warn)} .chip.b{color:var(--bad)} .chip.n{color:var(--muted)}
/* Prueba */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)} .dot.cur{background:var(--sun)}
.q{font-family:var(--display);font-weight:700;font-size:clamp(3rem,13vw,5.2rem);text-align:center;font-variant-numeric:tabular-nums;margin-block:12px 4px}
.ans{font-family:var(--display);font-weight:600;font-size:2.6rem;text-align:center;min-height:3.6rem;border-bottom:4px dashed var(--line);max-width:200px;margin:0 auto;font-variant-numeric:tabular-nums}
.ans.ok{color:var(--good);border-color:var(--good)} .ans.no{color:var(--bad);border-color:var(--bad)}
.fb{text-align:center;font-weight:800;min-height:1.6rem;margin-top:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:18px auto 0}
.key{background:var(--soft);font-family:var(--display);font-weight:600;font-size:1.8rem;padding:14px 0;border-radius:16px;box-shadow:0 3px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key.go{background:var(--mint);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.key.del{font-size:1.2rem}
/* Resultado */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.grade{font-family:var(--display);font-weight:700;font-size:5rem;line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars svg{width:40px;height:40px}
.review{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}
.rv{padding:8px 10px;border-radius:12px;background:var(--soft);font-weight:700;font-variant-numeric:tabular-nums;text-align:left}
.rv.no{outline:2px solid var(--bad)} .rv small{display:block;font-weight:600;color:var(--bad)}
/* Bienvenida */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%;max-width:520px}
.whoBtn{background:var(--soft);border-radius:20px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.whoBtn:hover{outline:3px solid var(--coral)}
.whoBtn.dad:hover{outline-color:var(--mint)}
.whoBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.whoBtn svg{width:56px;height:56px}
.whoBtn b{font-family:var(--display);font-size:1.5rem}
.whoBtn span{color:var(--muted);font-weight:700;font-size:.95rem}
/* Panel */
.gate{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.gate input{font:inherit;font-size:1.3rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:140px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--soft);border-radius:16px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:1.35rem}
.trow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tname{font-family:var(--display);font-weight:600;font-size:1.1rem}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.tmeta{font-size:.8rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.plan{background:var(--soft);border-radius:16px;padding:14px 16px;margin:0;display:flex;flex-direction:column;gap:6px}
.plan p{margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--soft);border-radius:12px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.fact small{color:var(--bad);margin-left:6px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.hist{display:flex;flex-direction:column;gap:6px}
details.h{background:var(--soft);border-radius:12px;padding:10px 14px}
details.h summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-variant-numeric:tabular-nums;list-style:none}
details.h summary::-webkit-details-marker{display:none}
details.h .review{margin-top:10px}
.sync{font-size:.8rem;color:var(--muted)}
/* Formularios */
.form{display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin-inline:auto}
.form form{display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:800}
.field small{color:var(--muted);font-size:.85rem}
.field input,.field select{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field input:focus,.field select:focus{border-color:var(--coral);outline:none}
.seg{display:flex;gap:8px}
.seg label{flex:1;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800}
.seg input:checked + span{border-color:var(--coral);background:var(--soft);color:var(--coral-ink)}
.seg input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.err{margin:0;min-height:1.4em;color:var(--bad);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions.center{justify-content:center;margin-top:8px}
.foot{margin:4px 0 0;text-align:center}
.recap{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--soft);border-radius:14px;padding:10px 20px}
.recap span{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.recap b{font-family:var(--display);font-size:1.4rem}
.btn.small{font-size:.95rem;padding:10px 16px}
/* Panel ancho */
body.wide .wrap{max-width:1080px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.device{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.device .link{padding-inline:0}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.kidCard{background:var(--surface);border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 var(--line),0 12px 30px -20px rgba(80,40,60,.35);transition:transform .1s}
.kidCard:hover{transform:translateY(-2px);outline:2px solid var(--coral)}
.kcTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kcTop h3{font-size:1.35rem}
.kcTop p{margin:2px 0 0;font-size:.85rem}
.kcAvg{font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kcMeta{margin:0;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips.left{justify-content:flex-start}
.back{align-self:flex-start;padding-left:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;background:var(--soft);border-radius:16px;padding:14px}
.filters .field input,.filters .field select{background:var(--surface);font-size:1rem;padding:10px 12px}
.kbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.field.inline{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.field.inline select{width:auto;max-width:100%;font-size:1rem;padding:8px 12px}
.kgrid{display:grid;grid-template-columns:1fr;gap:20px}
.kgrid > *{min-width:0}
@media (min-width:900px){ .kgrid{grid-template-columns:1fr 1fr} .kgrid .span2{grid-column:1 / -1} }
.quiz{max-width:560px;width:100%;margin-inline:auto}
@media (max-width:480px){ .card{padding:18px;border-radius:20px} .whoBtn b{font-size:1.3rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="crown" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 30 L4 12 L13 20 L20 8 L27 20 L36 12 L34 30 Z" fill="var(--sun)" stroke="var(--coral-ink)" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="8" r="2.5" fill="var(--coral)"/><circle cx="4" cy="12" r="2.2" fill="var(--mint)"/><circle cx="36" cy="12" r="2.2" fill="var(--mint)"/><rect x="6" y="30" width="28" height="4" rx="2" fill="var(--coral)"/></svg>
      <span id="brandName">Tablas del 1 al 9</span>
    </div>
    <button class="link" id="navBtn" type="button" hidden>Inicio</button>
  </header>
  <main id="app"></main>
  <p class="sync" id="sync"></p>
  <p class="sync" style="text-align:center;opacity:.6">Versión 3</p>
</div>
<script>
/* ====== CONFIGURACIÓN DE SUPABASE ====== */
const SUPABASE_URL = "https://xchugqfleewewjfsihdz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_acxxGAthw0D71O-XVjEgAA_33q_1pEa";
/* ======================================= */

const N_Q = 15;
const TABLES = [1,2,3,4,5,6,7,8,9];
const LS_PENDING = "tablasXimena.pending";
const LS_CACHE = "tablas.cache";
const LS_FAM = "tablas.familia";
const GRADOS = ["Preescolar","1° de primaria","2° de primaria","3° de primaria","4° de primaria","5° de primaria","6° de primaria","1° de secundaria","2° de secundaria","3° de secundaria","Otro"];

let view = "welcome";
let practiceData = [];
let panelData = null;      // respuesta de panel()
let panelCreds = null;     // solo en memoria
let panelSel = null;       // id del alumno abierto en el panel
let pollTimer = null;

/* ---------- Supabase ---------- */
async function rpc(fn, body){
  let r;
  try{
    r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  }catch(e){ throw new Error("red"); }
  const text = await r.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){}
  if(!r.ok){
    const detail = data ? [data.code, data.message].filter(Boolean).join(" ") : "";
    throw new Error(detail || ("Error " + r.status));
  }
  if(data && !Array.isArray(data) && data.error) throw new Error(data.error);
  return data;
}

/* ---------- almacenamiento local ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function fam(){ return lsGet(LS_FAM, null); }
function setFam(f){ lsSet(LS_FAM, f); updateBrand(); }
function activeKid(){
  const f = fam(); if(!f || !f.alumnos || !f.alumnos.length) return null;
  return f.alumnos.find(a=>a.id===f.activo) || f.alumnos[0];
}
function roleLabel(rol){ return rol==="mama" ? "Mamá" : "Papá"; }
function saveSession(s, keepActive){
  const prev = fam();
  const own = s.alumnos.filter(a=>a.padre===s.usuario);
  let activo = keepActive && prev && s.alumnos.some(a=>a.id===prev.activo) ? prev.activo : null;
  if(!activo) activo = (own[0] || s.alumnos[0] || {}).id || null;
  setFam({usuario:s.usuario, nombre:s.nombre, rol:s.rol, es_admin:!!s.es_admin,
          alumnos:s.alumnos.map(a=>({id:a.id,nombre:a.nombre,grado:a.grado,token:a.token,padre:a.padre})), activo});
}

/* pruebas pendientes de subir: [{token, t}] (las de la versión anterior no traen token) */
function pending(){ return lsGet(LS_PENDING, []).map(x => x && x.t ? x : {token:null, t:x}); }
async function flush(){
  const p = pending(); if(!p.length) return;
  const kid = activeKid();
  const left = [];
  for(const item of p){
    const token = item.token || (kid && kid.token);
    if(!token){ left.push(item); continue; }
    try{ await rpc("guardar_prueba", {token, p: item.t}); }
    catch(e){ left.push({token, t:item.t}); }
  }
  lsSet(LS_PENDING, left);
  updateSync();
}
async function loadPractice(){
  const kid = activeKid(); if(!kid){ practiceData = []; return; }
  const cache = lsGet(LS_CACHE, {});
  try{
    const d = await rpc("datos_practica", {token: kid.token});
    practiceData = Array.isArray(d) ? d : [];
    cache[kid.id] = practiceData; lsSet(LS_CACHE, cache);
  }catch(e){ practiceData = cache[kid.id] || []; }
}
function practiceList(){
  const kid = activeKid();
  const ids = new Set(practiceData.map(t=>t.id));
  const mine = pending().filter(x => !x.token || (kid && x.token===kid.token)).map(x=>x.t);
  return practiceData.concat(mine.filter(p=>!ids.has(p.id))).sort((a,b)=>a.fecha-b.fecha);
}
function updateSync(){
  const n = pending().length;
  document.getElementById("sync").textContent = n ? `${n} prueba(s) guardada(s) en este aparato; se subirán cuando haya internet.` : "";
}

/* ---------- modelo de aprendizaje ---------- */
function factStats(list){
  const byTable = {}; TABLES.forEach(t=>byTable[t]=[]);
  const factMiss = {};
  const ordered = list.slice().sort((a,b)=>b.fecha-a.fecha);
  ordered.forEach((t,ti)=>{
    (t.respuestas||[]).forEach(r=>{
      if(byTable[r.a]) byTable[r.a].push(r);
      const k = r.a+"×"+r.b;
      if(!factMiss[k]) factMiss[k] = {a:r.a,b:r.b,miss:0,total:0,recentMiss:0};
      factMiss[k].total++;
      if(!r.ok){ factMiss[k].miss++; if(ti<3) factMiss[k].recentMiss++; }
    });
  });
  return {byTable, factMiss};
}
function tableStatus(list){
  const {byTable} = factStats(list);
  const out = {};
  TABLES.forEach(t=>{
    const all = byTable[t];
    const recent = all.slice(0,12);
    const n = recent.length;
    const acc = n ? recent.filter(r=>r.ok).length/n : null;
    const totalAcc = all.length ? all.filter(r=>r.ok).length/all.length : null;
    const times = recent.filter(r=>r.ok && r.ms).map(r=>r.ms);
    const avgMs = times.length ? times.reduce((s,x)=>s+x,0)/times.length : null;
    let st = "nueva";
    if(n >= 8 && acc >= 0.9 && (avgMs===null || avgMs < 8000)) st = "dominada";
    else if(n >= 4 && acc < 0.7) st = "practicar";
    else if(n >= 1) st = "camino";
    out[t] = {n, acc, totalAcc, total:all.length, avgMs, st};
  });
  return out;
}
function weightFor(s){
  if(s.st==="dominada") return 0.2;
  if(s.st==="nueva") return 1.2;
  return 1 + (1 - s.acc) * 3;
}
function buildQuiz(){
  const list = practiceList();
  const status = tableStatus(list);
  const {factMiss} = factStats(list);
  const qs = []; const used = new Set();
  const perTable = {}; TABLES.forEach(t=>perTable[t]=0);
  Object.values(factMiss).filter(f=>f.recentMiss>0).sort((a,b)=>b.recentMiss-a.recentMiss)
    .slice(0,4).forEach(f=>{ const k=f.a+"×"+f.b; if(!used.has(k)){used.add(k); qs.push({a:f.a,b:f.b}); perTable[f.a]++;} });
  let guard = 0;
  while(qs.length < N_Q && guard++ < 500){
    const w = TABLES.map(t=>{
      const s = status[t]; let x = weightFor(s);
      if(s.st==="dominada" && perTable[t] >= 1) x = 0;
      return x;
    });
    const sum = w.reduce((a,b)=>a+b,0); if(!sum) break;
    let r = Math.random()*sum, t = TABLES[0];
    for(let i=0;i<w.length;i++){ r -= w[i]; if(r<=0){ t = TABLES[i]; break; } }
    const b = 1 + Math.floor(Math.random()*10);
    const k = t+"×"+b; if(used.has(k)) continue;
    used.add(k); qs.push({a:t,b}); perTable[t]++;
  }
  while(qs.length < N_Q){ const a=1+Math.floor(Math.random()*9), b=1+Math.floor(Math.random()*10); const k=a+"×"+b; if(!used.has(k)){used.add(k);qs.push({a,b});} }
  for(let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [qs[i],qs[j]]=[qs[j],qs[i]]; }
  return qs;
}

let quiz = null;
function startQuiz(){
  quiz = {qs:buildQuiz(), i:0, input:"", res:[], t0:performance.now(), locked:false, started:Date.now(), token:activeKid().token};
  renderQ();
}
function renderQ(){
  setView("quiz");
  const q = quiz.qs[quiz.i];
  const dots = quiz.qs.map((_,k)=>`<span class="dot ${k<quiz.i ? (quiz.res[k].ok?'ok':'no') : k===quiz.i?'cur':''}"></span>`).join("");
  $app().innerHTML = `
  <section class="card quiz">
    <div class="qhead"><span>Pregunta ${quiz.i+1} de ${N_Q}</span><div class="dots" aria-hidden="true">${dots}</div></div>
    <div class="q pop">${q.a} × ${q.b}</div>
    <div class="ans" id="ans" aria-live="polite">${esc(quiz.input)||"&nbsp;"}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}" type="button">${n}</button>`).join("")}
      <button class="key del" data-k="del" type="button" aria-label="Borrar">Borrar</button>
      <button class="key" data-k="0" type="button">0</button>
      <button class="key go" data-k="ok" type="button" aria-label="Revisar">✓</button>
    </div>
  </section>`;
  document.querySelectorAll(".key").forEach(b=>b.onclick=()=>press(b.dataset.k));
  quiz.t0 = performance.now();
}
function press(k){
  if(!quiz || quiz.locked) return;
  if(k==="del") quiz.input = quiz.input.slice(0,-1);
  else if(k==="ok"){ if(quiz.input) check(); return; }
  else if(quiz.input.length < 3) quiz.input += k;
  $("ans").innerHTML = esc(quiz.input)||"&nbsp;";
}
function check(){
  quiz.locked = true;
  const q = quiz.qs[quiz.i]; const val = parseInt(quiz.input,10);
  const ok = val === q.a*q.b;
  quiz.res.push({a:q.a,b:q.b,resp:val,ok,ms:Math.round(performance.now()-quiz.t0)});
  $("ans").classList.add(ok?"ok":"no");
  const cheers = ["¡Muy bien!","¡Excelente!","¡Así se hace!","¡Perfecto!","¡Bravo!"];
  $("fb").innerHTML = ok ? `<span style="color:var(--good)">${cheers[Math.floor(Math.random()*cheers.length)]}</span>`
                         : `<span style="color:var(--bad)">Casi. ${q.a} × ${q.b} = ${q.a*q.b}</span>`;
  setTimeout(()=>{
    if(!quiz) return;
    quiz.i++; quiz.input=""; quiz.locked=false;
    if(quiz.i >= N_Q) finish(); else renderQ();
  }, ok ? 900 : 2200);
}
async function finish(){
  const ok = quiz.res.filter(r=>r.ok).length;
  const t = {
    id: uuid(), fecha: Date.now(), aciertos: ok, total: N_Q,
    calificacion: grade10(ok,N_Q),
    duracionSeg: Math.round((Date.now()-quiz.started)/1000),
    respuestas: quiz.res
  };
  lsSet(LS_PENDING, pending().concat([{token:quiz.token, t}]));
  renderResult(t);
  await flush();
}
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16);});
}
function renderResult(t){

  const misses = t.respuestas.filter(r=>!r.ok);

    <div class="review">${misses.map(r=>`<div class="rv no">${r.a} × ${r.b} = ${r.a*r.b}<small>Escribiste ${r.resp}</small></div>`).join("")}</div>` : ""}

    const ts = testsOf(a.id);
    const st = tableStatus(ts);
    const prac = TABLES.filter(t=>st[t].st==="practicar");
    const dom = TABLES.filter(t=>st[t].st==="dominada");
    const last = ts[ts.length-1];
    return {a, ts, avg:avgOf(ts), last, prac, dom};
  }).sort((x,y)=>(y.last?y.last.fecha:0)-(x.last?x.last.fecha:0));
  $app().innerHTML = `
  <section class="card sec">
    <div class="phead">
      <div><h2>Hola, ${esc(d.nombre)}</h2>
      <p class="muted" style="margin:0">${d.es_admin ? "Administrador · ves a todos los alumnos registrados" : "Tus hijos"}</p></div>
      ${d.es_admin ? `<span class="chip g">Administrador</span>` : ""}
    </div>
    <div class="kpis">
      <div class="kpi"><span>Alumnos</span><b>${d.alumnos.length}</b></div>
      ${d.es_admin ? `<div class="kpi"><span>Familias</span><b>${familias}</b></div>` : ""}
      <div class="kpi"><span>Pruebas</span><b>${all.length}</b></div>
      <div class="kpi"><span>Promedio general</span><b style="color:${all.length?gradeColor(avgOf(all)):'inherit'}">${avgOf(all) ?? "—"}</b></div>
    </div>
    ${filters}
    ${deviceBox()}
  </section>
  <section class="kids">
    ${rows.map(r=>`
    <button class="kidCard" type="button" data-id="${esc(r.a.id)}" data-text="${esc((r.a.nombre+" "+r.a.padre_nombre+" "+r.a.padre).toLowerCase())}">
      <div class="kcTop">
        <div style="min-width:0"><h3>${esc(r.a.nombre)}</h3>
          <p class="muted">${esc(r.a.grado || "Sin grado")}${d.es_admin ? ` · ${esc(roleLabel(r.a.rol))}: ${esc(r.a.padre_nombre)} (@${esc(r.a.padre)})` : ""}</p></div>
        <b class="kcAvg" style="color:${r.avg!==null?gradeColor(r.avg):'var(--muted)'}">${r.avg ?? "—"}</b>
      </div>
      <p class="kcMeta">${r.ts.length} prueba${r.ts.length===1?"":"s"}${r.last ? ` · última: ${fmtDate(r.last.fecha)} (${r.last.calificacion})` : " · aún no hace pruebas"}</p>
      ${(r.prac.length||r.dom.length) ? `<div class="chips left">
        ${r.prac.map(t=>`<span class="chip b">× ${t}</span>`).join("")}
        ${r.dom.map(t=>`<span class="chip g">★ ${t}</span>`).join("")}
      </div>` : ""}
    </button>`).join("") || `<div class="card"><p class="muted" style="margin:0">Todavía no hay alumnos registrados.</p></div>`}
  </section>`;
  document.querySelectorAll(".kidCard").forEach(b=>b.onclick=()=>{ panelSel=b.dataset.id; renderPanel(); });
  if(d0.es_admin){
    $("fAlumno").onchange = e=>{ if(e.target.value){ panelSel = e.target.value; renderPanel(); } };
    $("fPadre").onchange = e=>{ adminFilter.padre = e.target.value; renderPanel(); };
    $("fBuscar").oninput = e=>{ adminFilter.q = e.target.value; applySearch(); };
    applySearch();
  }
  bindDevice();
}

function trendSvg(list){
  const pts = list.slice(-30);
  if(pts.length < 2) return `<p class="muted" style="margin:0">La gráfica aparece después de 2 pruebas.</p>`;
  const W=640,H=200,L=34,R=12,T=12,B=26;
  const x = i => L + i*(W-L-R)/(pts.length-1);
  const y = v => T + (10-v)*(H-T-B)/10;
  const grid = [0,5,7,9,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.calificacion).toFixed(1)}`).join(" ");
  const area = line + ` L${x(pts.length-1)},${y(0)} L${x(0)},${y(0)} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.calificacion)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--coral)':'var(--surface)'}" stroke="var(--coral)" stroke-width="2"><title>${fmtDate(p.fecha)}: ${p.calificacion}</title></circle>`).join("");
  const d0 = new Date(pts[0].fecha).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
  const d1 = new Date(pts[pts.length-1].fecha).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calificaciones de las últimas pruebas">${grid}<path d="${area}" fill="var(--coral)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--coral)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${d0}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${d1}</text></svg></div>`;
}

function renderKid(id, openIds){
  const d = panelData;
  const a = d.alumnos.find(x=>x.id===id);
  const list = testsOf(id);
  const name = esc(a.nombre);
  const status = tableStatus(list);
  const {factMiss} = factStats(list);
  const n = list.length;
  const avg = avgOf(list);
  const avg5 = avgOf(list.slice(-5));
  const best = n ? Math.max(...list.map(t=>Number(t.calificacion))) : null;
  const dom = TABLES.filter(t=>status[t].st==="dominada");
  const prac = TABLES.filter(t=>status[t].st==="practicar");
  const camino = TABLES.filter(t=>status[t].st==="camino");
  const worstFacts = Object.values(factMiss).filter(f=>f.miss>0).sort((p,q)=>(q.miss/q.total)-(p.miss/p.total) || q.miss-p.miss).slice(0,10);
  const ordered = TABLES.slice().sort((p,q)=>(status[p].acc??2)-(status[q].acc??2));
  const open = new Set(openIds||[]);
  const kid = activeKid();
  const onDevice = kid && kid.id===id;

  let plan = "";
  if(!n) plan = `<p>Todavía no hay pruebas. Cuando ${name} haga la primera, aquí verás qué tablas domina y cuáles practicar.</p>`;
  else {
    if(prac.length) plan += `<p><b>Enfocar esta semana:</b> tabla${prac.length>1?"s":""} del ${prac.join(", ")}. La app ya le pregunta más de estas.</p>`;
    if(camino.length) plan += `<p><b>Reforzar:</b> ${camino.join(", ")}. Van bien, falta constancia.</p>`;
    if(dom.length) plan += `<p><b>Ya domina:</b> ${dom.join(", ")}. Solo aparecen como repaso, máximo una vez por prueba.</p>`;
    if(worstFacts.length) plan += `<p><b>Multiplicaciones que más se le complican:</b> ${worstFacts.slice(0,4).map(f=>f.a+"×"+f.b).join(", ")}.</p>`;
  }

  $app().innerHTML = `
  ${showOverview() ? `<div class="kbar">
    <button class="link back" id="kBack" type="button">← Todos los alumnos</button>
    ${d.es_admin ? `<div class="field inline"><label for="kSwitch">Ver alumno</label><select id="kSwitch">${kidOptions(d, id)}</select></div>` : ""}
  </div>` : ""}
  <div class="kgrid">
  <section class="card sec span2">
    <div class="phead">
      <div style="min-width:0"><h2>Avance de ${name}</h2>
        <p class="muted" style="margin:0">${esc(a.grado || "Sin grado")}${d.es_admin ? ` · ${esc(roleLabel(a.rol))}: ${esc(a.padre_nombre)} (@${esc(a.padre)})` : ""}</p></div>
      ${onDevice ? `<span class="chip g">Practica en este aparato</span>` : `<button class="btn alt small" id="kUse" type="button">Que ${name} practique en este aparato</button>`}
    </div>
    <div class="kpis">
      <div class="kpi"><span>Pruebas</span><b>${n}</b></div>
      <div class="kpi"><span>Promedio general</span><b style="color:${avg!==null?gradeColor(avg):'inherit'}">${avg ?? "—"}</b></div>
      <div class="kpi"><span>Últimas 5</span><b style="color:${avg5!==null?gradeColor(avg5):'inherit'}">${avg5 ?? "—"}</b></div>
      <div class="kpi"><span>Mejor</span><b>${best ?? "—"}</b></div>
    </div>
    <div class="plan">${plan}</div>
    <p class="muted" style="margin:0;font-size:.8rem">Se actualiza solo cada 5 segundos.</p>
  </section>

  <section class="card sec">
    <h2>Calificaciones</h2>
    ${trendSvg(list)}
  </section>

  <section class="card sec">
    <h2>Dominio por tabla</h2>
    <p class="muted" style="margin:0;font-size:.9rem">Según sus últimas 12 respuestas de cada tabla. “Dominada” = 90% o más de aciertos con al menos 8 respuestas.</p>
    <div>
    ${ordered.map(t=>{
      const s = status[t]; const [lab,cls] = ST_LABEL[s.st];
      const pct = s.acc===null ? 0 : Math.round(s.acc*100);
      const col = s.st==="dominada"?"var(--good)":s.st==="practicar"?"var(--bad)":s.st==="camino"?"var(--warn)":"var(--line)";
      return `<div class="trow">
        <div class="tname">× ${t}</div>
        <div style="min-width:0"><div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
          <div class="tmeta">${s.acc===null?"Sin respuestas aún":`${pct}% reciente · ${Math.round(s.totalAcc*100)}% histórico · ${s.total} resp.${s.avgMs?` · ${(s.avgMs/1000).toFixed(1)} s`:""}`}</div></div>
        <span class="chip ${cls}">${lab}</span>
      </div>`;}).join("")}
    </div>
  </section>

  ${worstFacts.length ? `<section class="card sec span2">
    <h2>Las que más falla</h2>
    <div class="facts">${worstFacts.map(f=>`<span class="fact">${f.a} × ${f.b} = ${f.a*f.b}<small>${f.miss} de ${f.total}</small></span>`).join("")}</div>
  </section>` : ""}

  <section class="card sec span2">
    <h2>Historial completo</h2>
    <div class="hist">
    ${n ? list.slice().reverse().map(t=>`<details class="h" data-id="${esc(t.id)}" ${open.has(String(t.id))?"open":""}>
      <summary><span>${fmtDate(t.fecha)}</span><span><b style="color:${gradeColor(Number(t.calificacion))}">${t.calificacion}</b> · ${t.aciertos}/${t.total}</span></summary>
      <div class="review">${(t.respuestas||[]).map(r=>`<div class="rv ${r.ok?'':'no'}">${r.a} × ${r.b} = ${r.ok?r.resp:r.a*r.b}${r.ok?"":`<small>Escribió ${r.resp}</small>`}</div>`).join("")}</div>
      ${t.duracionSeg?`<p class="muted" style="margin:8px 0 0;font-size:.85rem">Duración: ${Math.floor(t.duracionSeg/60)} min ${t.duracionSeg%60} s</p>`:""}
    </details>`).join("") : `<p class="muted" style="margin:0">Aún no hay pruebas guardadas.</p>`}
    </div>
  </section>

  <section class="card sec span2">${deviceBox()}</section>
  </div>`;
  if(showOverview()) $("kBack").onclick = ()=>{ panelSel=null; renderPanel(); };
  if(d.es_admin) $("kSwitch").onchange = e=>{ panelSel = e.target.value; renderPanel(); };
  if(!onDevice) $("kUse").onclick = ()=>{ const f = fam(); f.activo = id; setFam(f); renderPanel(); };
  bindDevice();
}

/* ---------- arranque ---------- */
$("navBtn").onclick = ()=>{
  if(view==="quiz" && quiz && quiz.i>0 && quiz.i<N_Q) return;   // no salir a media prueba
  renderWelcome();
};
document.addEventListener("keydown", e=>{
  if(view!=="quiz") return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==="Backspace") press("del");
  else if(e.key==="Enter") press("ok");
});
window.addEventListener("online", flush);
updateBrand(); renderWelcome(); updateSync(); flush();

</script>
</body>
